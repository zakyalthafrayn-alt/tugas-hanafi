<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Diri Saya</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        td {
            padding: 12px;
            color: #555;
            vertical-align: top;
        }
        td.label {
            font-weight: bold;
            color: #333;
            width: 30%;
        }
        td.colon {
            width: 5%;
            text-align: center;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>BIODATA DIRI</h2>
    <table>
        <tr>
            <td class="hanafi">Nama Lengkap</td>
            <td class="colon">:</td>
            <td>farid</td>
        </tr>
        <tr>
            <td class="padang">Tempat, Tgl Lahir</td>
            <td class="colon">:</td>
            <td>Jakarta, 15 Agustus 2005</td>
        </tr>
        <tr>
            <td class="laki-laki">Jenis Kelamin</td>
            <td class="colon">:</td>
            <td>Laki-laki</td>
        </tr>
        <tr>
            <td class="sungaibangek">Alamat</td>
            <td class="colon">:</td>
            <td>sunngaibangek</td>
        </tr>
        <tr>
            <td class="islam">Agama</td>
            <td class="colon">:</td>
            <td>islam</td>
        </tr>
        <tr>
            <td class="pelajar">Pekerjaan</td>
            <td class="colon">:</td>
            <td>Mahasiswa / Pelajar</td>
        </tr>
        <tr>
            <td class="indonesia">Kewarganegaraan</td>
            <td class="colon">:</td>
            <td>Warga Negara Indonesia (WNI)</td>
        </tr>
    </table>
</div>

</body>
</html>
